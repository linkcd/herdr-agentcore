[project]
name = "herdr-agentcore-workspace"
version = "0.1.0"
description = "Herdr connector for independently deployed AgentCore terminal runtimes"
requires-python = ">=3.11"
dependencies = ["herdr-agentcore==0.1.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/herdr_plugin"]

[tool.uv.sources]
herdr-agentcore = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["src/herdr_plugin/tests"]
asyncio_mode = "auto"
pythonpath = ["src", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
