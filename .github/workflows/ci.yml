name: Plugin checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check src/herdr_plugin scripts
      - run: uv run ruff format --check src/herdr_plugin scripts
      - run: uv run pytest
      - run: uv run python scripts/check_publication.py
      - run: uv run python src/herdr_plugin/tests/repository_privacy.py
      - run: uv build --package herdr-agentcore
      - run: uv run python src/herdr_plugin/tests/check_distributions.py --dist dist
      - run: uv run python scripts/package_contract.py
      - name: Check production installation
        run: |
          uv sync --frozen --no-dev
          .venv/bin/python -m herdr_agentcore --help
          .venv/bin/python -c "from herdr_agentcore.contract import decode_descriptor"
